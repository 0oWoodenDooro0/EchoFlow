name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      rust_core: ${{ steps.filter.outputs.rust_core }}
      frontend: ${{ steps.filter.outputs.frontend }}
      tauri_check: ${{ steps.filter.outputs.tauri_check }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust_core:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'crates/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'apps/desktop/src/**'
              - 'apps/desktop/package.json'
              - 'apps/desktop/package-lock.json'
              - 'apps/desktop/biome.json'
              - 'apps/desktop/tsconfig*.json'
              - 'apps/desktop/vite.config.*'
              - 'apps/desktop/index.html'
              - 'apps/desktop/src-tauri/src/lib.rs'
              - '.github/workflows/ci.yml'
            tauri_check:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'crates/**'
              - 'apps/desktop/**'
              - '.github/workflows/ci.yml'

  rust-core:
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.rust_core == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features

  frontend:
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  tauri-check:
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.tauri_check == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
      - name: Install Tauri Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libasound2-dev \
            libsecret-1-dev \
            libx11-dev \
            libxtst-dev
      - name: Build frontend dist
        working-directory: apps/desktop
        run: npm ci && npm run build
      - name: Check Tauri desktop shell
        run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml
