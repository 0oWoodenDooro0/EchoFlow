[package]
name = "echoflow-desktop"
version = "0.1.0"
edition = "2021"
description = "Tauri v2 desktop shell for EchoFlow"

[lib]
name = "echoflow_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
async-trait = "0.1"
echoflow-core = { path = "../../../crates/echoflow-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1"
